name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Bundles the mobile app's JavaScript for both platforms. No device or native build:
      # this catches modules that fail to resolve in the monorepo, which typecheck does not.
      - run: pnpm --filter @cort/mobile exec expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/mobile-bundle"
